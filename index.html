<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <meta name="theme-color" content="#06040d">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >
  <meta
    name="apple-mobile-web-app-title"
    content="GO UP TIMER"
  >

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">

  <title>GO UP TIMER</title>

  <style>
    /* =========================================================
       GO UP TIMER — V2 MOBILE iOS
       ========================================================= */

    :root {
      --bg: #05030a;
      --panel: rgba(17, 11, 34, .82);
      --panel-2: rgba(25, 15, 47, .82);

      --white: #ffffff;
      --text: #eee9f8;
      --muted: #aaa2bb;
      --dim: #716a80;

      --pink: #ff35bb;
      --pink-light: #ff76d7;
      --purple: #9a4dff;
      --violet: #bd75ff;
      --blue: #42aaff;
      --cyan: #3de8ff;

      --green: #30e69c;
      --red: #ff5275;
      --yellow: #ffd84d;

      --radius: 24px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;

      color: var(--white);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Helvetica Neue",
        Arial,
        sans-serif;

      background:
        radial-gradient(
          ellipse at 10% 0%,
          rgba(124, 39, 255, .38),
          transparent 32%
        ),
        radial-gradient(
          ellipse at 100% 18%,
          rgba(255, 32, 181, .23),
          transparent 30%
        ),
        radial-gradient(
          ellipse at 50% 65%,
          rgba(42, 75, 255, .14),
          transparent 42%
        ),
        radial-gradient(
          ellipse at 10% 100%,
          rgba(104, 37, 255, .20),
          transparent 35%
        ),
        linear-gradient(
          160deg,
          #05030a 0%,
          #0a0614 50%,
          #05040c 100%
        );

      overflow-x: hidden;
    }

    /* Étoiles discrètes */

    body::before {
      content: "";

      position: fixed;
      inset: 0;

      pointer-events: none;

      background-image:
        radial-gradient(circle, rgba(255,255,255,.32) 0 1px, transparent 1.5px),
        radial-gradient(circle, rgba(190,140,255,.25) 0 1px, transparent 1.5px),
        radial-gradient(circle, rgba(100,210,255,.22) 0 1px, transparent 1.5px);

      background-size:
        97px 97px,
        143px 143px,
        181px 181px;

      background-position:
        10px 20px,
        30px 80px,
        80px 40px;

      opacity: .38;
    }

    button {
      font: inherit;
    }

    /* =========================================================
       APP
       ========================================================= */

    .app {
      position: relative;

      width: 100%;
      max-width: 620px;

      margin: 0 auto;

      padding:
        calc(18px + env(safe-area-inset-top))
        16px
        calc(30px + env(safe-area-inset-bottom));

      z-index: 1;
    }

    /* =========================================================
       HEADER
       ========================================================= */

    .top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;

      margin-bottom: 12px;
    }

    .brand {
      min-width: 0;
    }

    .eyebrow {
      margin-bottom: 3px;

      font-size: 13px;
      line-height: 1;

      font-weight: 800;
      letter-spacing: .30em;

      color: #e7dff1;

      text-transform: uppercase;

      text-shadow:
        0 0 12px rgba(173, 90, 255, .55);
    }

    h1 {
      margin: 0;

      font-size: clamp(49px, 15vw, 74px);
      line-height: .86;

      font-weight: 950;
      letter-spacing: -.075em;

      background:
        linear-gradient(
          100deg,
          #ffffff 0%,
          #ffd5f3 19%,
          #ff62c7 44%,
          #bd68ff 69%,
          #55aaff 100%
        );

      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;

      filter:
        drop-shadow(0 0 12px rgba(255, 54, 195, .25))
        drop-shadow(0 0 25px rgba(135, 74, 255, .18));
    }

    .tagline {
      margin-top: 14px;

      font-size: 10px;
      line-height: 1.3;

      font-weight: 800;
      letter-spacing: .21em;

      color: #ddd6e8;

      text-transform: uppercase;
    }

    /* =========================================================
       REFRESH
       ========================================================= */

    .refresh {
      flex: 0 0 auto;

      width: 50px;
      height: 50px;

      margin-top: 3px;

      border: 1px solid rgba(255,255,255,.16);
      border-radius: 17px;

      color: white;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.14),
          rgba(255,255,255,.045)
        );

      box-shadow:
        0 12px 28px rgba(0,0,0,.28),
        inset 0 1px 0 rgba(255,255,255,.12),
        0 0 22px rgba(141,76,255,.10);

      font-size: 28px;
      line-height: 1;

      cursor: pointer;
    }

    .refresh:active {
      transform: scale(.92);
    }

    /* =========================================================
       STATUS
       ========================================================= */

    .status {
      display: flex;
      align-items: center;
      justify-content: center;

      min-height: 25px;

      margin: 6px 0 17px;

      color: var(--muted);

      font-size: 13px;
      font-weight: 500;
    }

    .status::first-letter {
      color: var(--green);
    }

    /* =========================================================
       CARDS
       ========================================================= */

    .card {
      position: relative;

      margin-bottom: 14px;

      border: 1px solid rgba(159, 80, 255, .34);
      border-radius: var(--radius);

      background:
        linear-gradient(
          145deg,
          rgba(37, 20, 63, .80),
          rgba(10, 7, 20, .87)
        );

      box-shadow:
        0 18px 50px rgba(0,0,0,.38),
        inset 0 1px 0 rgba(255,255,255,.055);

      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);

      overflow: hidden;
    }

    .card::after {
      content: "";

      position: absolute;

      top: -90px;
      right: -90px;

      width: 190px;
      height: 190px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(177,78,255,.16),
          transparent 70%
        );

      pointer-events: none;
    }

    .hidden {
      display: none !important;
    }

    /* =========================================================
       TITRES DE SECTION
       ========================================================= */

    .label,
    .section-title {
      position: relative;

      z-index: 2;

      font-size: 11px;
      font-weight: 850;

      letter-spacing: .16em;

      color: #d9d1e5;

      text-transform: uppercase;
    }

    .label::before {
      content: "⚡";

      display: inline-block;

      margin-right: 8px;

      color: #ffca4c;

      filter:
        drop-shadow(0 0 7px rgba(255,196,61,.65));
    }

    /* =========================================================
       PROCHAIN ÉVÉNEMENT — COMPACT
       ========================================================= */

    .next {
      padding: 15px 16px 13px;

      border-color: rgba(171, 77, 255, .56);

      background:
        radial-gradient(
          ellipse at 0% 0%,
          rgba(255,48,190,.13),
          transparent 38%
        ),
        radial-gradient(
          ellipse at 100% 100%,
          rgba(45,121,255,.15),
          transparent 42%
        ),
        linear-gradient(
          145deg,
          rgba(35,18,61,.93),
          rgba(8,6,17,.94)
        );

      box-shadow:
        0 20px 55px rgba(0,0,0,.48),
        0 0 35px rgba(148,59,255,.13),
        inset 0 1px 0 rgba(255,255,255,.08);
    }

    .next::before {
      content: "";

      position: absolute;

      left: -70px;
      bottom: -80px;

      width: 190px;
      height: 190px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(255,50,191,.11),
          transparent 70%
        );

      pointer-events: none;
    }

    .event-title {
      position: relative;
      z-index: 2;

      display: flex;
      align-items: center;

      gap: 11px;

      margin-top: 9px;

      min-width: 0;
    }

    .event-title span:first-child {
      flex: 0 0 auto;

      width: 54px;
      height: 54px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 39px;
      line-height: 1;

      filter:
        drop-shadow(0 0 8px rgba(255,255,255,.16));
    }

    .event-title span:last-child {
      min-width: 0;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;

      font-size: clamp(29px, 9vw, 44px);
      line-height: 1;

      font-weight: 900;
      letter-spacing: -.055em;

      background:
        linear-gradient(
          100deg,
          #ffffff 0%,
          #f9eaff 45%,
          #bd9cff 100%
        );

      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;

      text-shadow:
        0 0 20px rgba(187,111,255,.16);
    }

    /* =========================================================
       COUNTDOWN
       ========================================================= */

    .countdown {
      position: relative;
      z-index: 2;

      margin-top: 11px;

      font-variant-numeric: tabular-nums;

      font-size: clamp(47px, 15vw, 76px);
      line-height: .92;

      font-weight: 850;
      letter-spacing: -.065em;

      white-space: nowrap;

      background:
        linear-gradient(
          100deg,
          #ff48bd 0%,
          #d75eff 38%,
          #a06cff 65%,
          #5ab7ff 100%
        );

      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;

      filter:
        drop-shadow(0 0 11px rgba(255,54,192,.27))
        drop-shadow(0 0 25px rgba(130,79,255,.20));
    }

    .sub {
      position: relative;
      z-index: 2;

      margin-top: 6px;

      font-size: 13px;
      color: #bcb4c9;

      letter-spacing: .02em;
    }

    /* =========================================================
       BARRE DE PROGRESSION
       ========================================================= */

    .progress-wrap {
      position: relative;
      z-index: 2;

      display: flex;
      align-items: center;

      gap: 10px;

      margin-top: 11px;
    }

    .progress {
      flex: 1;

      height: 9px;

      border-radius: 999px;

      overflow: hidden;

      background:
        rgba(44, 37, 69, .95);

      border: 1px solid rgba(255,255,255,.06);

      box-shadow:
        inset 0 2px 4px rgba(0,0,0,.35);
    }

    .progress-bar {
      width: 0%;
      height: 100%;

      border-radius: inherit;

      background:
        linear-gradient(
          90deg,
          #ff40bd,
          #c45fff 48%,
          #45c5ff
        );

      box-shadow:
        0 0 10px rgba(255,65,190,.48);

      transition:
        width .5s ease;
    }

    .progress-percent {
      min-width: 36px;

      font-size: 11px;
      font-weight: 700;

      color: #d6cce1;

      text-align: right;
    }

    /* =========================================================
       LIVE — COMPACT
       ========================================================= */

    .live {
      padding: 14px 16px 12px;

      border-color: rgba(255,76,110,.45);

      background:
        radial-gradient(
          circle at 100% 0%,
          rgba(255,50,90,.15),
          transparent 38%
        ),
        linear-gradient(
          145deg,
          rgba(52,17,40,.87),
          rgba(12,7,19,.90)
        );
    }

    .live .label {
      color: #ff8d9f;
    }

    .live .label::before {
      content: "🔴";
      filter: none;
    }

    /* =========================================================
       NOTIFICATIONS
       ========================================================= */

    .notifications {
      padding: 16px;
    }

    .notifications .section-title {
      margin-bottom: 12px;
    }

    .push-button {
      position: relative;

      width: 100%;
      min-height: 55px;

      border: 1px solid rgba(68,236,191,.43);
      border-radius: 18px;

      color: white;

      background:
        linear-gradient(
          110deg,
          rgba(39,181,166,.18),
          rgba(54,119,255,.12)
        );

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.07),
        0 10px 28px rgba(0,0,0,.20);

      font-size: 12px;
      font-weight: 850;
      letter-spacing: .05em;

      cursor: pointer;
    }

    .push-button:active {
      transform: scale(.985);
    }

    .push-status {
      margin-top: 10px;

      font-size: 12px;
      line-height: 1.45;

      color: #aaa2b8;
    }

    /* =========================================================
       LISTE DES ÉVÉNEMENTS
       ========================================================= */

    .schedule {
      padding: 16px 14px 14px;
    }

    .schedule .section-title {
      display: flex;
      align-items: center;

      margin: 2px 4px 13px;
    }

    .schedule .section-title::before {
      content: "📅";

      margin-right: 8px;

      font-size: 15px;
    }

    #events {
      display: flex;
      flex-direction: column;

      gap: 8px;
    }

    #events > * {
      position: relative;

      display: flex;
      align-items: center;

      min-height: 62px;

      padding: 9px 12px;

      border: 1px solid rgba(157,132,193,.18);
      border-radius: 18px;

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,.065),
          rgba(255,255,255,.018)
        );

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.035),
        0 5px 16px rgba(0,0,0,.13);

      overflow: hidden;
    }

    #events > *::before {
      content: "";

      position: absolute;

      left: 0;
      top: 0;
      bottom: 0;

      width: 3px;

      background:
        linear-gradient(
          180deg,
          #ff4fc5,
          #914eff,
          #43aaff
        );

      box-shadow:
        0 0 10px rgba(190,75,255,.35);
    }

    #events > *:active {
      transform: scale(.99);
    }

    #events img {
      flex: 0 0 auto;

      width: 40px;
      height: 40px;

      margin-left: 3px;

      object-fit: contain;

      border-radius: 11px;
    }

    #events strong {
      font-size: 15px;
      font-weight: 800;

      color: #f6f2fa;
    }

    #events small {
      font-size: 11px;
      color: #a9a0b8;
    }

    /* =========================================================
       FOOTER
       ========================================================= */

    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;

      gap: 10px;

      margin-top: 2px;
      padding: 5px 5px 0;

      color: #716a80;

      font-size: 9px;
      letter-spacing: .035em;
    }

    /* =========================================================
       PETITS IPHONE
       ========================================================= */

    @media (max-width: 375px) {

      .app {
        padding-left: 12px;
        padding-right: 12px;
      }

      h1 {
        font-size: 48px;
      }

      .tagline {
        font-size: 9px;
        letter-spacing: .16em;
      }

      .refresh {
        width: 45px;
        height: 45px;
      }

      .card {
        border-radius: 21px;
      }

      .next {
        padding: 13px 14px 11px;
      }

      .live {
        padding: 12px 14px 10px;
      }

      .event-title {
        margin-top: 8px;
      }

      .event-title span:first-child {
        width: 46px;
        height: 46px;
        font-size: 33px;
      }

      .event-title span:last-child {
        font-size: 30px;
      }

      .countdown {
        margin-top: 9px;
        font-size: 44px;
      }

      .sub {
        margin-top: 5px;
      }

      .next .progress-wrap {
        margin-top: 9px;
      }

      #events > * {
        min-height: 58px;
      }
    }

    /* =========================================================
       IPAD / GRAND ÉCRAN
       ========================================================= */

    @media (min-width: 700px) {

      body {
        padding: 25px 0;
      }

      .app {
        max-width: 720px;
      }

      .countdown {
        font-size: 76px;
      }
    }

    /* =========================================================
       ACCESSIBILITÉ
       ========================================================= */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }

    /* =========================================================
   ESPACEMENT ÉVÉNEMENT / HORAIRE
   ========================================================= */

#events .row {
  display: flex;
  align-items: center;
  gap: 10px;
}

#events .row .name {
  flex: 1;
  min-width: 0;
}

#events .row .time {
  flex: 0 0 auto;
  margin-left: 20px;
  white-space: nowrap;
}
  </style>
</head>

<body>

  <main class="app">

    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header class="top">

      <div class="brand">

        <div class="eyebrow">
          ⚡ GO UP
        </div>

        <h1>TIMER</h1>

        <div class="tagline">
          NE RATE PLUS AUCUN ÉVÉNEMENT
        </div>

      </div>

      <button
        id="refresh"
        class="refresh"
        aria-label="Actualiser"
      >
        ↻
      </button>

    </header>


    <!-- =====================================================
         STATUT API
         ===================================================== -->

    <section
      id="status"
      class="status"
      aria-live="polite"
    >
      BY 🍁𝔸𝕝𝕒𝕟🍁
    </section>


    <!-- =====================================================
         ÉVÉNEMENT EN DIRECT
         ===================================================== -->

    <section
      id="liveCard"
      class="card live hidden"
    >

      <div class="label">
        ÉVÉNEMENT EN DIRECT
      </div>

      <div class="event-title">

        <span id="liveEmoji"></span>

        <span id="liveName"></span>

      </div>

      <div
        id="liveCountdown"
        class="countdown"
      >
        --:--
      </div>

      <div class="sub">
        temps restant
      </div>

    </section>


    <!-- =====================================================
         PROCHAIN ÉVÉNEMENT
         ===================================================== -->

    <section
      id="nextCard"
      class="card next"
    >

      <div class="label">
        PROCHAIN ÉVÉNEMENT
      </div>

      <div class="event-title">

        <span id="nextEmoji"></span>

        <span id="nextName">
          —
        </span>

      </div>

      <div
        id="nextCountdown"
        class="countdown"
      >
        --:--:--
      </div>

      <div
        id="nextTime"
        class="sub"
      >
        —
      </div>

      <!-- Barre visuelle -->

      <div class="progress-wrap">

        <div class="progress">

          <div
            id="progressBar"
            class="progress-bar"
          ></div>

        </div>

        <div
          id="progressPercent"
          class="progress-percent"
        >
          —
        </div>

      </div>

    </section>


    <!-- =====================================================
         NOTIFICATIONS
         ===================================================== -->

    <section class="card notifications">

      <div class="section-title">
        🔔 NOTIFICATIONS
      </div>

      <button
        id="pushButton"
        class="push-button"
      >
        🔔 ACTIVER LES NOTIFICATIONS
      </button>

      <div
        id="pushStatus"
        class="push-status"
      >
        Active les alertes GO UP 10 minutes avant chaque événement.
      </div>

    </section>


    <!-- =====================================================
         TOUS LES ÉVÉNEMENTS
         ===================================================== -->

    <section class="card schedule">

      <div class="section-title">
        TOUS LES ÉVÉNEMENTS
      </div>

      <div id="events"></div>

    </section>


    <!-- =====================================================
         FOOTER
         ===================================================== -->

    <footer>

      <span id="updated">
        Dernière mise à jour : —
      </span>

      <span>
        Europe/Paris
      </span>

    </footer>

  </main>


  <script src="app.js"></script>


  <!-- =======================================================
       PROGRESSION DU PROCHAIN ÉVÉNEMENT
       ======================================================= -->

  <script>
    /*
     * Cette partie ajoute uniquement l'affichage de la barre
     * de progression.
     *
     * Elle ne modifie pas le fonctionnement de l'API.
     */

    (function () {

      const bar = document.getElementById("progressBar");
      const percent = document.getElementById("progressPercent");

      if (!bar || !percent) return;

      function updateProgress() {

        const countdown = document.getElementById("nextCountdown");

        if (!countdown) return;

        const value = countdown.textContent.trim();

        const match = value.match(
          /^(\d+):(\d{2}):(\d{2})$/
        );

        if (!match) {
          bar.style.width = "0%";
          percent.textContent = "—";
          return;
        }

        const hours = Number(match[1]);
        const minutes = Number(match[2]);
        const seconds = Number(match[3]);

        const remaining =
          hours * 3600 +
          minutes * 60 +
          seconds;

        const tenMinutes = 10 * 60;

        if (remaining <= tenMinutes && remaining > 0) {

          const progress =
            ((tenMinutes - remaining) / tenMinutes) * 100;

          const safeProgress =
            Math.max(0, Math.min(100, progress));

          bar.style.width =
            safeProgress.toFixed(0) + "%";

          percent.textContent =
            Math.round(safeProgress) + "%";

        } else {

          bar.style.width = "0%";
          percent.textContent = "—";

        }
      }

      updateProgress();

      setInterval(updateProgress, 1000);

    })();
  </script>

</body>
</html>
