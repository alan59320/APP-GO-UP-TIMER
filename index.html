<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <meta name="theme-color" content="#080611">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >
  <meta
    name="apple-mobile-web-app-title"
    content="GO UP TIMER"
  >

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">

  <title>GO UP TIMER</title>

  <style>
    /* =========================================================
       GO UP TIMER — MOBILE iOS NEON
       ========================================================= */

    :root {
      --bg: #07050d;
      --bg-2: #0d0919;
      --card: rgba(20, 15, 38, 0.78);
      --card-strong: rgba(25, 18, 48, 0.92);

      --white: #ffffff;
      --muted: #a9a3bc;
      --muted-2: #706a82;

      --pink: #ff3cac;
      --purple: #9b5cff;
      --blue: #3c9cff;
      --cyan: #55e6ff;

      --green: #45f2a0;
      --red: #ff5470;

      --border: rgba(173, 117, 255, 0.28);
      --shadow: rgba(0, 0, 0, 0.55);

      --radius: 24px;
      --safe-top: env(safe-area-inset-top);
      --safe-bottom: env(safe-area-inset-bottom);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      background: var(--bg);
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;

      color: var(--white);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Helvetica Neue",
        Arial,
        sans-serif;

      background:
        radial-gradient(
          circle at 15% 5%,
          rgba(145, 62, 255, 0.30),
          transparent 30%
        ),
        radial-gradient(
          circle at 90% 18%,
          rgba(255, 47, 175, 0.18),
          transparent 28%
        ),
        radial-gradient(
          circle at 50% 100%,
          rgba(45, 104, 255, 0.18),
          transparent 38%
        ),
        linear-gradient(
          145deg,
          #05040a 0%,
          #0a0713 45%,
          #080612 100%
        );

      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;

      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,.08) 0 1px, transparent 1.5px),
        radial-gradient(circle at 70% 30%, rgba(255,255,255,.06) 0 1px, transparent 1.5px),
        radial-gradient(circle at 40% 75%, rgba(255,255,255,.05) 0 1px, transparent 1.5px),
        radial-gradient(circle at 85% 85%, rgba(255,255,255,.05) 0 1px, transparent 1.5px);

      background-size:
        95px 95px,
        135px 135px,
        160px 160px,
        180px 180px;

      opacity: .55;
    }

    button {
      font: inherit;
    }

    /* =========================================================
       APP
       ========================================================= */

    .app {
      position: relative;
      width: 100%;
      max-width: 560px;
      margin: 0 auto;

      padding:
        calc(18px + var(--safe-top))
        16px
        calc(28px + var(--safe-bottom));

      z-index: 1;
    }

    /* =========================================================
       HEADER
       ========================================================= */

    .top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;

      margin-bottom: 18px;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .eyebrow {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .22em;
      color: #d8d2e6;

      text-transform: uppercase;
    }

    h1 {
      margin: 0;

      font-size: clamp(39px, 12vw, 58px);
      line-height: .88;

      font-weight: 900;
      letter-spacing: -0.07em;

      background:
        linear-gradient(
          100deg,
          #ffffff 5%,
          #ff72d0 42%,
          #a65cff 72%,
          #55b9ff 100%
        );

      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;

      filter:
        drop-shadow(0 0 12px rgba(198, 73, 255, .35));
    }

    .tagline {
      margin-top: 11px;

      font-size: 10px;
      font-weight: 700;
      letter-spacing: .18em;

      color: #d5cede;

      text-transform: uppercase;
    }

    .refresh {
      width: 46px;
      height: 46px;

      margin-top: 3px;

      border: 1px solid rgba(255,255,255,.14);
      border-radius: 15px;

      color: white;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.12),
          rgba(255,255,255,.04)
        );

      box-shadow:
        0 8px 25px rgba(0,0,0,.25),
        inset 0 0 18px rgba(145,90,255,.10);

      font-size: 25px;
      line-height: 1;

      cursor: pointer;
    }

    .refresh:active {
      transform: scale(.94);
    }

    /* =========================================================
       STATUS API
       ========================================================= */

    .status {
      min-height: 20px;

      margin-bottom: 12px;

      font-size: 11px;
      color: var(--muted);

      text-align: center;
    }

    /* =========================================================
       CARDS
       ========================================================= */

    .card {
      position: relative;

      margin-bottom: 14px;
      padding: 18px;

      border: 1px solid var(--border);
      border-radius: var(--radius);

      background:
        linear-gradient(
          145deg,
          rgba(35, 24, 61, .84),
          rgba(10, 8, 20, .82)
        );

      box-shadow:
        0 18px 50px rgba(0,0,0,.38),
        inset 0 1px 0 rgba(255,255,255,.06);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      overflow: hidden;
    }

    .card::before {
      content: "";

      position: absolute;
      top: -100px;
      right: -100px;

      width: 200px;
      height: 200px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(164,75,255,.18),
          transparent 68%
        );

      pointer-events: none;
    }

    .hidden {
      display: none !important;
    }

    .label,
    .section-title {
      position: relative;

      font-size: 11px;
      font-weight: 800;
      letter-spacing: .13em;

      color: #d5cde4;

      text-transform: uppercase;
    }

    .label::before {
      content: "⚡";

      display: inline-block;
      margin-right: 7px;

      color: #ffca54;

      filter:
        drop-shadow(0 0 8px rgba(255,190,50,.6));
    }

    /* =========================================================
       NEXT EVENT
       ========================================================= */

    .next {
      padding: 21px 18px 20px;

      border-color: rgba(170, 91, 255, .48);

      background:
        radial-gradient(
          circle at 10% 20%,
          rgba(255,57,190,.12),
          transparent 32%
        ),
        radial-gradient(
          circle at 90% 80%,
          rgba(60,150,255,.13),
          transparent 35%
        ),
        linear-gradient(
          145deg,
          rgba(30, 19, 55, .94),
          rgba(9, 7, 19, .94)
        );

      box-shadow:
        0 20px 55px rgba(0,0,0,.45),
        0 0 35px rgba(136,61,255,.10),
        inset 0 1px 0 rgba(255,255,255,.07);
    }

    .event-title {
      display: flex;
      align-items: center;
      gap: 10px;

      margin-top: 13px;

      min-width: 0;
    }

    .event-title span:first-child {
      flex: 0 0 auto;

      font-size: 34px;
      line-height: 1;
    }

    .event-title span:last-child {
      min-width: 0;

      font-size: clamp(27px, 8vw, 40px);
      line-height: 1;

      font-weight: 900;
      letter-spacing: -.045em;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;

      background:
        linear-gradient(
          100deg,
          #ffffff,
          #f3dfff 45%,
          #a987ff
        );

      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .countdown {
      margin-top: 17px;

      font-variant-numeric: tabular-nums;

      font-size: clamp(42px, 13vw, 65px);
      line-height: .95;

      font-weight: 800;
      letter-spacing: -.055em;

      color: #fff;

      text-shadow:
        0 0 8px rgba(255,255,255,.18),
        0 0 25px rgba(154,77,255,.32);

      white-space: nowrap;
    }

    .next .countdown {
      background:
        linear-gradient(
          100deg,
          #ff65c8,
          #b56cff 45%,
          #57baff 90%
        );

      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .sub {
      margin-top: 8px;

      font-size: 12px;
      color: var(--muted);

      letter-spacing: .03em;
    }

    /* =========================================================
       LIVE
       ========================================================= */

    .live {
      border-color: rgba(255, 75, 104, .45);

      background:
        radial-gradient(
          circle at 80% 0%,
          rgba(255,45,92,.16),
          transparent 35%
        ),
        var(--card);
    }

    .live .label {
      color: #ff8294;
    }

    .live .label::before {
      content: "🔴";
      filter: none;
    }

    /* =========================================================
       NOTIFICATIONS
       ========================================================= */

    .notifications {
      padding: 15px;
    }

    .notifications .section-title {
      margin-bottom: 11px;
    }

    .push-button {
      width: 100%;
      min-height: 52px;

      border: 1px solid rgba(79, 241, 166, .35);
      border-radius: 16px;

      color: #fff;

      background:
        linear-gradient(
          135deg,
          rgba(65, 242, 160, .16),
          rgba(48, 140, 255, .10)
        );

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.06),
        0 8px 25px rgba(0,0,0,.20);

      font-size: 12px;
      font-weight: 800;
      letter-spacing: .04em;

      cursor: pointer;
    }

    .push-button:active {
      transform: scale(.985);
    }

    .push-status {
      margin-top: 9px;

      font-size: 11px;
      line-height: 1.45;

      color: var(--muted);
    }

    /* =========================================================
       EVENT LIST
       ========================================================= */

    .schedule {
      padding: 16px;
    }

    .schedule .section-title {
      display: flex;
      align-items: center;

      margin-bottom: 13px;
    }

    .schedule .section-title::before {
      content: "📅";

      margin-right: 7px;
    }

    #events {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    /*
      Les éléments générés par app.js peuvent avoir
      différentes classes. Ces styles donnent une apparence
      cohérente aux lignes d'événements.
    */

    #events > * {
      position: relative;

      display: flex;
      align-items: center;
      gap: 11px;

      min-height: 64px;
      padding: 10px 12px;

      border: 1px solid rgba(255,255,255,.08);
      border-radius: 17px;

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,.055),
          rgba(255,255,255,.018)
        );

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.035);
    }

    #events > *:active {
      transform: scale(.99);
    }

    #events img {
      width: 39px;
      height: 39px;

      object-fit: contain;

      border-radius: 12px;
    }

    #events strong {
      font-size: 14px;
      font-weight: 800;
    }

    #events small {
      color: var(--muted);
      font-size: 11px;
    }

    /* =========================================================
       FOOTER
       ========================================================= */

    footer {
      display: flex;
      justify-content: space-between;
      gap: 12px;

      padding: 8px 4px 0;

      color: var(--muted-2);

      font-size: 9px;
      letter-spacing: .04em;
    }

    /* =========================================================
       IPHONE PETITS ÉCRANS
       ========================================================= */

    @media (max-width: 360px) {
      .app {
        padding-left: 12px;
        padding-right: 12px;
      }

      .card {
        padding: 15px;
        border-radius: 21px;
      }

      .event-title span:first-child {
        font-size: 29px;
      }

      .event-title span:last-child {
        font-size: 27px;
      }

      .countdown {
        font-size: 40px;
      }

      .push-button {
        font-size: 10px;
      }
    }

    /* =========================================================
       IPAD / ÉCRANS PLUS LARGES
       ========================================================= */

    @media (min-width: 700px) {
      body {
        padding: 30px 0;
      }

      .app {
        max-width: 720px;
      }

      .next .countdown {
        font-size: 72px;
      }
    }

    /* =========================================================
       ACCESSIBILITÉ
       ========================================================= */

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header class="top">

      <div class="brand">

        <div class="eyebrow">
          ⚡ GO UP
        </div>

        <h1>TIMER</h1>

        <div class="tagline">
          NE RATE PLUS AUCUN ÉVÉNEMENT
        </div>

      </div>

      <button
        id="refresh"
        class="refresh"
        aria-label="Actualiser"
      >
        ↻
      </button>

    </header>


    <!-- =====================================================
         API STATUS
         ===================================================== -->

    <section
      id="status"
      class="status"
      aria-live="polite"
    >
      Connexion à l'API…
    </section>


    <!-- =====================================================
         ÉVÉNEMENT EN DIRECT
         ===================================================== -->

    <section
      id="liveCard"
      class="card live hidden"
    >

      <div class="label">
        ÉVÉNEMENT EN DIRECT
      </div>

      <div class="event-title">
        <span id="liveEmoji"></span>
        <span id="liveName"></span>
      </div>

      <div
        id="liveCountdown"
        class="countdown"
      >
        --:--
      </div>

      <div class="sub">
        temps restant
      </div>

    </section>


    <!-- =====================================================
         PROCHAIN ÉVÉNEMENT
         ===================================================== -->

    <section
      id="nextCard"
      class="card next"
    >

      <div class="label">
        PROCHAIN ÉVÉNEMENT
      </div>

      <div class="event-title">

        <span id="nextEmoji"></span>

        <span id="nextName">
          —
        </span>

      </div>

      <div
        id="nextCountdown"
        class="countdown"
      >
        --:--:--
      </div>

      <div
        id="nextTime"
        class="sub"
      >
        —
      </div>

    </section>


    <!-- =====================================================
         NOTIFICATIONS
         ===================================================== -->

    <section class="card notifications">

      <div class="section-title">
        🔔 NOTIFICATIONS
      </div>

      <button
        id="pushButton"
        class="push-button"
      >
        🔔 ACTIVER LES NOTIFICATIONS
      </button>

      <div
        id="pushStatus"
        class="push-status"
      >
        Active les alertes GO UP 10 minutes avant chaque événement.
      </div>

    </section>


    <!-- =====================================================
         TOUS LES ÉVÉNEMENTS
         ===================================================== -->

    <section class="card schedule">

      <div class="section-title">
        TOUS LES ÉVÉNEMENTS
      </div>

      <div id="events">
        <!--
          Ton app.js remplira automatiquement cette zone
          avec les événements récupérés depuis ton API.
        -->
      </div>

    </section>


    <!-- =====================================================
         FOOTER
         ===================================================== -->

    <footer>

      <span id="updated">
        Dernière mise à jour : —
      </span>

      <span>
        Europe/Paris
      </span>

    </footer>

  </main>


  <!-- =======================================================
       JAVASCRIPT EXISTANT
       ======================================================= -->

  <script src="app.js"></script>

</body>
</html>
