<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0b12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GO UP TIMER">
  <link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
  <title>GO UP TIMER</title>
</head>
<body>
  <main class="app">
    <header class="top">
      <div>
        <div class="eyebrow">🚀 GO UP</div>
        <h1>TIMER</h1>
      </div>
      <button id="refresh" class="refresh" aria-label="Actualiser">↻</button>
    </header>

    <section id="status" class="status">Connexion à l'API…</section>

    <section id="liveCard" class="card live hidden">
      <div class="label">🔴 ÉVÉNEMENT EN DIRECT</div>
      <div class="event-title"><span id="liveEmoji"></span><span id="liveName"></span></div>
      <div id="liveCountdown" class="countdown">--:--</div>
      <div class="sub">temps restant</div>
    </section>

    <section id="nextCard" class="card next">
      <div class="label">PROCHAIN ÉVÉNEMENT</div>
      <div class="event-title"><span id="nextEmoji"></span><span id="nextName">—</span></div>
      <div id="nextCountdown" class="countdown">--:--:--</div>
      <div id="nextTime" class="sub">—</div>
    </section>

    <section class="card schedule">
      <div class="section-title">📅 À VENIR</div>
      <div id="events"></div>
    </section>

    <footer>
      <span id="updated">Dernière mise à jour : —</span>
      <span>Europe/Paris</span>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
